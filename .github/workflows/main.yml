name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # ✅ latest version

      - name: Setup Pages
        uses: actions/configure-pages@v5   # ✅ latest version

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3   # ✅ correct replacement
        with:
          path: .   # publish everything in your repo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4   # ✅ latest version
